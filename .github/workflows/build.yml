name: Build Tune APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            ccache build-essential

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Pre-accept Android SDK licenses
        run: |
          LIC=~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          mkdir -p $(dirname $LIC)
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $LIC
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $LIC
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $LIC
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $LIC

      - name: Fix sdkmanager path
        run: |
          SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/tools/bin
          # Ищем sdkmanager в cmdline-tools
          if [ -f $SDK/cmdline-tools/latest/bin/sdkmanager ]; then
            ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          elif [ -f $SDK/cmdline-tools/bin/sdkmanager ]; then
            ln -sf $SDK/cmdline-tools/bin/sdkmanager $SDK/tools/bin/sdkmanager
          else
            # Скачиваем cmdline-tools если их нет
            mkdir -p /tmp/cmdline
            curl -L -o /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mkdir -p $SDK/cmdline-tools/latest
            mv /tmp/cmdline/cmdline-tools/* $SDK/cmdline-tools/latest/
            chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
            ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          fi
          ls -la $SDK/tools/bin/sdkmanager

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          yes y | buildozer -v android debug 2>&1 | tee build.log
          if [ ! -f bin/*.apk ]; then
            echo "APK не создан!"
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tune-APK
          path: bin/*.apk
          retention-days: 30
